name: Keep backend and database awake

# The Supabase free plan pauses a project after about a week without activity,
# and the Render free plan puts the backend to sleep when idle.
# This job calls the backend health check, which runs a small database query,
# so both stay active. It fails (and GitHub emails the repo owner) when the
# database is not connected.
#
# Note: GitHub turns off scheduled workflows after 60 days without any commit
# to the repository. Re-enable it from the Actions tab if that happens.

on:
  schedule:
    - cron: '0 0,12 * * *' # 09:00 and 21:00 KST
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Call backend health check
        run: |
          for attempt in 1 2 3 4 5; do
            body=$(curl -s --max-time 120 https://hotelworks-backend.onrender.com/health || true)
            echo "attempt $attempt: $body"
            if echo "$body" | grep -q '"status":"connected"'; then
              echo "Database connected."
              exit 0
            fi
            sleep 30
          done
          echo "Database is not connected after 5 attempts."
          exit 1
